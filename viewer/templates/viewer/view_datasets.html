{% extends "viewer/base.html" %}

{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-full">
    <h1 class="govuk-heading-xl">View Datasets</h1>
    <p class="govuk-body">Select a dataset from the dropdown to view its metadata.</p>

    <div class="govuk-form-group">
      <label class="govuk-label" for="datasetSelect">Select a dataset</label>
      <select class="govuk-select" id="datasetSelect">
        <option value="" selected disabled>Choose…</option>
        {% for dataset in datasets %}
          <option value="{{ dataset.file }}">{{ dataset.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div id="output" class="govuk-body" aria-live="polite"></div>
  </div>
</div>

<script>
  const selectEl = document.getElementById('datasetSelect');
  const outputEl = document.getElementById('output');

  function renderMetadata(data) {
    outputEl.innerHTML = ''; // Clear previous content

    // --- Render Owner Classification ---
    if (data.owner_classification) {
      const ownerTitle = document.createElement('h2');
      ownerTitle.className = 'govuk-heading-l'; // Made heading larger
      ownerTitle.textContent = 'Owner Classification';
      outputEl.appendChild(ownerTitle);

      const ownerList = document.createElement('dl');
      ownerList.className = 'govuk-summary-list govuk-!-margin-bottom-9';

      for (const [key, value] of Object.entries(data.owner_classification)) {
        const row = document.createElement('div');
        row.className = 'govuk-summary-list__row';
        
        const dt = document.createElement('dt');
        dt.className = 'govuk-summary-list__key';
        dt.textContent = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        
        const dd = document.createElement('dd');
        dd.className = 'govuk-summary-list__value';
        dd.textContent = value;

        row.appendChild(dt);
        row.appendChild(dd);
        ownerList.appendChild(row);
      }
      outputEl.appendChild(ownerList);
    }

    // --- Render Columns ---
    if (data.columns && Array.isArray(data.columns)) {
      const columnsTitle = document.createElement('h2');
      columnsTitle.className = 'govuk-heading-l'; // Made heading larger
      columnsTitle.textContent = 'Columns';
      outputEl.appendChild(columnsTitle);

      // Loop through each column and create a separate summary list for it
      data.columns.forEach(col => {
        const colTitle = document.createElement('h3');
        colTitle.className = 'govuk-heading-m';
        colTitle.textContent = col.column_name || 'Unnamed Column';
        outputEl.appendChild(colTitle);

        const colList = document.createElement('dl');
        colList.className = 'govuk-summary-list govuk-!-margin-bottom-7';

        const metadataOrder = ['description', 'data_type', 'format', 'coercion_warnings'];
        
        metadataOrder.forEach(key => {
          const row = document.createElement('div');
          row.className = 'govuk-summary-list__row';
          
          const dt = document.createElement('dt');
          dt.className = 'govuk-summary-list__key';
          dt.textContent = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
          
          const dd = document.createElement('dd');
          dd.className = 'govuk-summary-list__value';
          dd.textContent = col[key] || 'N/A';

          row.appendChild(dt);
          row.appendChild(dd);
          colList.appendChild(row);
        });

        outputEl.appendChild(colList);
      });
    }
  }

  selectEl.addEventListener('change', (e) => {
    const datasetKey = e.target.value;
    if (!datasetKey) return;

    outputEl.textContent = 'Loading…';

    fetch(`/get_dataset/${datasetKey}/`)
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        renderMetadata(data);
      })
      .catch(error => {
        console.error('Error fetching dataset YAML:', error);
        outputEl.textContent = 'Error loading dataset metadata.';
      });
  });
</script>
{% endblock %}
